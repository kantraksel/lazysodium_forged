name: Build Release

on:
  push:
    branches:
      - 1.20.1
  pull_request:
    branches:
      - 1.20.1

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest

    env:
      LIBSODIUM_VERSION: 1.0.20
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: microsoft
          java-version: 17
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/cache@v4
        id: cache
        with:
          key: libsodium.${{ env.LIBSODIUM_VERSION }}
          path: libsodium.${{ env.LIBSODIUM_VERSION }}
          
      - name: Get libsodium binaries
        if: steps.cache.outputs.cache-hit != 'true'
        run: nuget install libsodium -Version ${{ env.LIBSODIUM_VERSION }}
      - name: Copy binaries to resources
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cp --recursive "libsodium.${{ env.LIBSODIUM_VERSION }}/runtimes/linux-x64/native" "src/main/resources/linux64"
          cp --recursive "libsodium.${{ env.LIBSODIUM_VERSION }}/runtimes/osx-x64/native" "src/main/resources/mac"
          cp --recursive "libsodium.${{ env.LIBSODIUM_VERSION }}/runtimes/osx-arm64/native" "src/main/resources/mac_arm"
          cp --recursive "libsodium.${{ env.LIBSODIUM_VERSION }}/runtimes/win-x64/native" "src/main/resources/windows64"
        
      - name: Gradle Jar
        run: ./gradlew jar
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: build/libs/*.jar
          compression-level: 0
