name: Platform Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.arch }} check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        arch: [x64]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
          architecture: ${{ matrix.arch }}
      - name: Test with Gradle
        run: ./gradlew test

  test-on-mac-arm:
    name: ${{ matrix.os }} ${{ matrix.arch }} check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
        arch: [arm64]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Java on ARM64
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
      - name: Test with Gradle
        run: ./gradlew test
